<!DOCTYPE html>
    <head>
        <title>Edit Account</title>
        <link rel="stylesheet" href="./css/toggle-switch.css">
        <link rel="stylesheet" href="./css/edit-account.css">
        <script src = "./js/account.js" defer></script>
    </head>
    <body>
        <div class="parent-row header">
            <div class="header-logo">
                <img src="./eduksine-logo.png"/>
            </div>
        </div>
        <div class = "acctInfo">
            <div class="email">
                <div class="input">
                    <label for = "email">Email: </label>
                    <input type = "textbox" name = "email" id = "email" placeholder = "Email"/>
                </div>
            </div>
            <div class="fName">
                <div class="input">
                    <label for = "fName">First Name: </label>
                    <input type = "textbox" name = "fName" id = "fName" placeholder = "First Name"/>
                </div>
            </div>
            <div class="lName">
                <div class="input">
                    <label for = "lName">Last Name: </label>
                    <input type = "textbox" name = "lName" id = "lName" placeholder = "Last Name"/>
                </div>
            </div>
            <div class="password">
                <div class="input">
                    <label for = "password">Password: </label>
                    <input type = "password" name = "password" id = "password" placeholder = "Password"/>
                </div>
            </div>
            <div class="makeAdmin">
                <label for="makeAdmin" class="switch">
                    <input type="checkbox" id="makeAdmin">
                    <span class="slider round"></span>
                </label>
                <label for="makeAdmin">ADMIN ACCESS</label>
            </div>
            <div class="saveEdits">
                <div class="button">
                    <input type="submit" name="addMov" id="saveEdits" value="Save">
                </div>
            </div>
        </div>
    </body>
</html>
